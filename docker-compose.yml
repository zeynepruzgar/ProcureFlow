services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ALLOW_ORIGINS: http://localhost:3000
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.2
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
